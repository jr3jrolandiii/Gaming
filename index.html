<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill-In Crossword</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f6f3eb;color:#222}.app{max-width:620px;margin:auto;padding:14px}h1{font-size:23px}.board{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:#222;border:2px solid #222}.cell{aspect-ratio:1;background:white;border:0;padding:0;font-size:clamp(9px,3vw,17px);font-weight:bold;color:#111}.black{background:#222}.bad{background:#ffb4b4}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}button{touch-action:manipulation;cursor:pointer}.tool{padding:10px;border:1px solid #aaa;border-radius:8px;background:white;font-weight:bold}.msg{padding:12px;background:#e9e4d8;border-radius:8px}.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.word{padding:9px 2px;border:1px solid #bbb;border-radius:7px;background:white;font-weight:bold}.chosen{background:#ffe18a}.used{text-decoration:line-through;opacity:.4}h3{font-size:13px;margin-bottom:7px}</style><div class="app"><h1>🧩 Fill-In Crossword</h1><p id="count">0 placed</p><div id="board" class="board"></div><div class="toolbar"><button id="dir" class="tool">↔ Across</button><button id="undo" class="tool">Undo</button><button id="check" class="tool">Check</button><button id="reset" class="tool">Restart</button></div><p id="msg" class="msg">Choose a word, then tap a square where you think it fits. No locations are revealed.</p><h2>Word List</h2><div id="list"></div></div><script>
const N=13,b=Array.from({length:N},()=>Array(N).fill('#'));const blocks=[{r:0,c:0,a:['HEART','EMBER','ABUSE','RESIN','TREND']},{r:0,c:8,a:['BALL','AREA','LEAD','LADY']},{r:8,c:0,a:['CAT','ARE','TEN']},{r:8,c:7,a:['HEART','EMBER','ABUSE','RESIN','TREND']}];blocks.forEach(o=>o.a.forEach((s,y)=>[...s].forEach((v,x)=>b[o.r+y][o.c+x]=v)));let slots=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c]!='#')for(let [d,dy,dx] of [['Across',0,1],['Down',1,0]]){if(r-dy>=0&&c-dx>=0&&b[r-dy][c-dx]!='#')continue;let a=[],y=r,x=c;while(y<N&&x<N&&b[y][x]!='#'){a.push(y*N+x);y+=dy;x+=dx}if(a.length>=3)slots.push({id:slots.length,d,a,w:a.map(i=>b[Math.floor(i/N)][i%N]).join('')})}let selected=null,dir='Across',placed={},history=[],checking=false;const el=id=>document.getElementById(id),words=slots.map(s=>({id:s.id,w:s.w})).sort((a,b)=>a.w.length-b.w.length||a.w.localeCompare(b.w));function letters(){let a={};for(let [id,slot] of Object.entries(placed))slots[slot].a.forEach((p,j)=>a[p]=slots[id].w[j]);return a}function draw(){let l=letters();el('board').replaceChildren();for(let i=0;i<N*N;i++){let ch=b[Math.floor(i/N)][i%N],q=document.createElement('button');q.className='cell'+(ch=='#'?' black':'')+(checking&&l[i]&&l[i]!=ch?' bad':'');q.textContent=l[i]||'';q.disabled=ch=='#';q.onclick=()=>tap(i);el('board').append(q)}el('list').replaceChildren();for(let len of [...new Set(words.map(x=>x.w.length))]){let h=document.createElement('h3');h.textContent=len+' LETTERS';let g=document.createElement('div');g.className='words';words.filter(x=>x.w.length===len).forEach(x=>{let q=document.createElement('button');q.className='word'+(selected===x.id?' chosen':'')+(placed[x.id]!==undefined?' used':'');q.textContent=x.w;q.onclick=()=>{if(placed[x.id]!==undefined){delete placed[x.id];history=[];el('msg').textContent='Word removed';}else{selected=x.id;el('msg').textContent='Selected '+x.w+'. Tap a space.'}checking=false;draw()};g.append(q)});el('list').append(h,g)}el('count').textContent=Object.keys(placed).length+' / '+slots.length+' placed';el('dir').textContent=dir==='Across'?'↔ Across':'↕ Down'}function tap(i){if(selected===null){el('msg').textContent='Select a word first';return}let w=slots[selected].w,l=letters(),dest=slots.find(s=>s.d===dir&&s.w.length===w.length&&s.a.includes(i)&&!Object.values(placed).includes(s.id)&&s.a.every((p,j)=>!l[p]||l[p]===w[j]));if(!dest){el('msg').textContent='That word does not fit here. Try another space or direction.';return}history.push({...placed});placed[selected]=dest.id;selected=null;checking=false;el('msg').textContent='Word placed!';draw()}el('dir').onclick=()=>{dir=dir==='Across'?'Down':'Across';draw()};el('undo').onclick=()=>{if(history.length){placed=history.pop();selected=null;checking=false;draw()}};el('check').onclick=()=>{checking=true;draw();el('msg').textContent='Incorrect letters are pink.'};el('reset').onclick=()=>{placed={};history=[];selected=null;checking=false;draw()};draw();
</script></html>
